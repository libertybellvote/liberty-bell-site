name: Liberty Bell Model Update

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Liberty Bell model session
        run: node scripts/run-model-session.js

      - name: Commit and push if site-data.json changed
        run: |
          git config user.name "Liberty Bell Bot"
          git config user.email "actions@github.com"
          git add site-data.json ledger.json
          git diff --staged --quiet || git commit -m "Automated model update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
