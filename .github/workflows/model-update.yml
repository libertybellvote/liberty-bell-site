name: The Bell Model Update

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: the-bell-model-update
  cancel-in-progress: false

jobs:
  update-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Refresh free market data
        id: market_update
        continue-on-error: true
        run: node scripts/run-model-session.js

      - name: Refresh national primary polling
        id: polling_update
        continue-on-error: true
        run: node scripts/refresh-polling.js

      - name: Refresh latest YouTube upload
        id: youtube_update
        continue-on-error: true
        run: node scripts/refresh-youtube.js

      - name: Collect free nine-signal evidence
        run: node scripts/collect-evidence.js

      - name: Score The Bell Model
        run: node scripts/score-bell-model.js

      - name: Commit and push any updated site data
        if: always()
        run: |
          git config user.name "The Bell Bot"
          git config user.email "actions@github.com"
          git add site-data.json ledger.json evidence-ledger.json model-state.json model-inputs.json race-history.json
          git diff --staged --quiet || git commit -m "Automated model update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
